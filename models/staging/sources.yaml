version: 2

sources:
  - name: olist
    description: "Raw Olist Brazilian e-commerce data loaded from Kaggle CSVs into Snowflake"
    database: OLIST
    schema: RAW
    tables:
      - name: ORDERS_DATASET
        description: "All orders placed on Olist platform between 2016-2018"
      - name: CUSTOMER_DATASET
        description: "Customer details including location data"
      - name: ORDER_ITEM_DATASET
        description: "Individual items within each order"
      - name: ORDER_PAYMENTS_DATASET
        description: "Payment transactions per order"
      - name: ORDER_REVIEWS_DATASET
        description: "Customer reviews and scores per order"
      - name: PRODUCTS_DATASET
        description: "Product metadata including dimensions and category"
      - name: SELLERS_DATASET
        description: "Seller location details"
      - name: GEOLOCATION_DATASET
        description: "Zip code to latitude/longitude mapping"
      - name: PRODUCT_CATEGORY_NAME
        description: "Portuguese to English product category translations"