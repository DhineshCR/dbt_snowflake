version: 2

models:
  - name: fct_orders
    description: "Fact table with one row per order. Central model joining orders, 
                  items, payments and reviews with delivery performance metrics."
    columns:
      - name: order_id
        description: "Primary key — unique order identifier"
        tests:
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - not_null
      - name: order_status
        description: "Current status of the order"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled',
                         'unavailable', 'invoiced',
                         'processing', 'created', 'approved']
      - name: actual_delivery_days
        description: "Number of days from purchase to actual delivery"
      - name: estimated_delivery_days
        description: "Number of days from purchase to estimated delivery"
      - name: delivery_status
        description: "on_time, late, or not_delivered based on actual vs estimated"
      - name: total_payment
        description: "Total payment value for the order"

  - name: dim_customers
    description: "Customer dimension with one row per customer 
                  including lifetime order and spend metrics."
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: lifetime_value
        description: "Total spend across all orders"
      - name: avg_review_score
        description: "Average review score given by this customer"

  - name: dim_products
    description: "Product dimension with one row per product 
                  including aggregated sales performance metrics."
    columns:
      - name: product_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: category
        description: "English product category name"
      - name: total_revenue
        description: "Total revenue generated by this product"